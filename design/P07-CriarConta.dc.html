<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>P07 Criar conta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1A}a:hover{color:#5D5A52}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #1C1C1A; font-family: 'Public Sans', sans-serif; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="font-size: 16px; font-weight: 800">MargoAI</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 26px; line-height: 1.2">Crie sua conta</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #3F3D38">{{dias}} dias grátis para ver o lucro por canal. Sem cartão agora.</p>
</div>
<form style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px"><label for="nome" style="font-size: 13px; font-weight: 600">Seu nome</label><input id="nome" style="min-height: 44px; padding: 0 12px; border: 1px solid #BDB7A9; border-radius: 8px; font-size: 15px"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="loja" style="font-size: 13px; font-weight: 600">Restaurante</label><input id="loja" value="Pantanos Burguer" style="min-height: 44px; padding: 0 12px; border: 1px solid #BDB7A9; border-radius: 8px; font-size: 15px"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="cnpj" style="font-size: 13px; font-weight: 600">CNPJ da loja</label><input id="cnpj" placeholder="00.000.000/0000-00" style="min-height: 44px; padding: 0 12px; border: 1px solid #BDB7A9; border-radius: 8px; font-size: 15px; font-family: 'IBM Plex Mono', monospace"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="zap" style="font-size: 13px; font-weight: 600">WhatsApp</label><input id="zap" placeholder="(43) 9 0000-0000" style="min-height: 44px; padding: 0 12px; border: 1px solid #BDB7A9; border-radius: 8px; font-size: 15px"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="mail" style="font-size: 13px; font-weight: 600">E-mail</label><input id="mail" type="email" style="min-height: 44px; padding: 0 12px; border: 1px solid #BDB7A9; border-radius: 8px; font-size: 15px"></div>
<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45"><input type="checkbox" style="margin-top: 3px; width: 18px; height: 18px"> <span>Li e aceito os <a href="P11-Termos.dc.html">termos e a política de privacidade</a>.</span></label>
</form>
<a href="P03-Autorizar.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; background: #1C1C1A; color: #FFFFFF; border-radius: 10px; font-weight: 700; text-decoration: none">Começar meus {{dias}} dias grátis</a>
<a href="P15-Entrar.dc.html" style="text-align: center; font-size: 14px">Já tenho conta: entrar</a>
<div style="font-size: 13px; color: #5D5A52; line-height: 1.5">Entramos com um código no seu WhatsApp, sem senha. No fim do teste você escolhe um plano, ou a conta volta para o raio-X grátis.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dias":{"editor":"int","default":14,"min":1,"max":60},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { dias: this.props.dias ?? 14 }; }
}
</script>
</body>
</html>
