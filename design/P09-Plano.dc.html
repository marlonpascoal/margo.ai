<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>P09 Escolher plano</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400..800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1A}a:hover{color:#5D5A52}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F4EF; color: #1C1C1A; font-family: 'Public Sans', sans-serif; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center"><a href="P08-MinhaConta.dc.html" style="font-size: 14px">Minha conta</a><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5D5A52">preços de exemplo</span></div>
<h1 style="margin: 0; font-size: 24px; line-height: 1.2">Seu teste grátis acaba em 9 dias</h1>
<p style="margin: 0; font-size: 14px; color: #3F3D38; line-height: 1.5">Escolha como continuar. Se não escolher, a conta volta para o plano grátis e nada é cobrado.</p>
<sc-for list="{{plans}}" as="p" hint-placeholder-count="3">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="text-align: left; background: #FFFFFF; border: {{p.border}}; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; font-family: 'Public Sans', sans-serif; color: #1C1C1A">
<span style="display: flex; justify-content: space-between; width: 100%; align-items: baseline"><b style="font-size: 17px">{{p.n}}</b><span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600">{{p.price}}</span></span>
<span style="font-size: 13px; line-height: 1.45; color: #3F3D38">{{p.d}}</span>
</button>
</sc-for>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 14px"><span>Escolhido: <b>{{sel}}</b></span><span style="font-family: 'IBM Plex Mono', monospace">{{total}}</span></div>
<a href="{{next}}" style="display: flex; align-items: center; justify-content: center; min-height: 48px; background: #1C1C1A; color: #FFFFFF; border-radius: 10px; font-weight: 700; text-decoration: none">{{cta}}</a>
<div style="font-size: 12px; color: #5D5A52; text-align: center">Só cartão de crédito. Cancele quando quiser.</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pick: 'lucro' }; }
  renderVals() {
    const P = [
      { id: 'gratis', n: 'Raio-X', price: 'grátis', d: 'Raio-X de preço contra a vizinhança, uma vez por trimestre. Sem conectar nada.', total: 'R$ 0', cta: 'Ficar no grátis', next: 'P08-MinhaConta.dc.html' },
      { id: 'lucro', n: 'Lucro', price: 'R$ 300/loja/mês', d: 'Fechamento mensal por canal, diferenças no repasse com contestação, e quanto sobra por item com o custo das notas.', total: 'R$ 300/mês', cta: 'Continuar para o pagamento', next: 'P10-Pagamento.dc.html' },
      { id: 'rede', n: 'Rede', price: '5 lojas ou mais', d: 'Tudo do Lucro, com preço por conversa e atendimento direto dos fundadores.', total: 'a combinar', cta: 'Falar com a gente', next: 'P02-WhatsRaioX.dc.html' }
    ];
    const cur = this.state.pick;
    const s = P.find((x) => x.id === cur);
    return {
      plans: P.map((x) => ({ ...x, on: x.id === cur, border: x.id === cur ? '2px solid #1C1C1A' : '1px solid #D6D2C4', pick: () => this.setState({ pick: x.id }) })),
      sel: s.n, total: s.total, cta: s.cta, next: s.next
    };
  }
}
</script>
</body>
</html>
