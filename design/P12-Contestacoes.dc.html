<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>P12 Minhas contestações</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400..800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1A}a:hover{color:#5D5A52}
</style>
</helmet>
<div style="width: 390px; height: 960px; box-sizing: border-box; background: #F6F4EF; color: #1C1C1A; font-family: 'Public Sans', sans-serif; padding: 18px 14px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center"><a href="P08-MinhaConta.dc.html" style="font-size: 14px">Minha conta</a><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5D5A52">dados fictícios</span></div>
<h1 style="margin: 0; font-size: 22px">Minhas contestações</h1>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; font-size: 12px">
<div style="background: #E3F2EC; padding: 8px; border-radius: 8px"><b style="font-family: 'IBM Plex Mono', monospace; font-size: 15px">R$ 238</b><br>já voltou</div>
<div style="background: #FFFFFF; border: 1px solid #D6D2C4; padding: 8px; border-radius: 8px"><b style="font-family: 'IBM Plex Mono', monospace; font-size: 15px">R$ 412</b><br>em análise no iFood</div>
<div style="background: #FBEAE7; padding: 8px; border-radius: 8px"><b style="font-family: 'IBM Plex Mono', monospace; font-size: 15px">R$ 306</b><br>para você contestar</div>
<div style="background: #FFF4E0; padding: 8px; border-radius: 8px"><b style="font-family: 'IBM Plex Mono', monospace; font-size: 15px">R$ 148</b><br>precisa da sua resposta</div>
</div>
<sc-for list="{{items}}" as="i" hint-placeholder-count="6">
<div style="background: #FFFFFF; border: 1px solid #D6D2C4; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline"><b style="font-size: 14px; line-height: 1.3">{{i.t}}</b><span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600">{{i.v}}</span></div>
<div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px"><span style="padding: 2px 8px; border-radius: 999px; background: {{i.bg}}">{{i.pill}}</span><span style="color: #5D5A52">{{i.info}}</span></div>
<sc-if value="{{i.isContestar}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 6px"><button type="button" style="flex: 1; min-height: 36px; border: 1px solid #BDB7A9; background: #FFFFFF; border-radius: 6px; font-size: 13px">Copiar texto pronto</button><button type="button" onClick="{{i.marcar}}" style="flex: 1; min-height: 36px; border: 0; background: #1C1C1A; color: #FFFFFF; border-radius: 6px; font-size: 13px">Já contestei</button></div>
</sc-if>
<sc-if value="{{i.isAnalise}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 6px; align-items: center; font-size: 12px; color: #5D5A52"><span style="flex: 1">Conferimos o crédito no próximo repasse.</span><button type="button" onClick="{{i.negar}}" style="min-height: 36px; padding: 0 10px; border: 1px solid #BDB7A9; background: #FFFFFF; border-radius: 6px; font-size: 13px">Foi negada</button></div>
</sc-if>
<sc-if value="{{i.isResposta}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 6px; align-items: center; font-size: 13px"><span style="flex: 1">Esse desconto foi combinado com o iFood?</span><button type="button" onClick="{{i.sim}}" style="min-height: 36px; padding: 0 12px; border: 1px solid #BDB7A9; background: #FFFFFF; border-radius: 6px">Sim</button><button type="button" onClick="{{i.nao}}" style="min-height: 36px; padding: 0 12px; border: 1px solid #BDB7A9; background: #FFFFFF; border-radius: 6px">Não</button></div>
</sc-if>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { st: { a: 'analise', b: 'creditada', c: 'contestar', d: 'contestar', e: 'resposta', f: 'espera' } }; }
  renderVals() {
    const S = {
      contestar: { pill: 'a contestar', bg: '#FBEAE7' },
      analise: { pill: 'contestada · em análise', bg: '#EFECE5' },
      creditada: { pill: 'creditada', bg: '#E3F2EC' },
      negada: { pill: 'negada', bg: '#E5E3DE' },
      vencida: { pill: 'prazo vencido', bg: '#E5E3DE' },
      resposta: { pill: 'precisa da sua resposta', bg: '#FFF4E0' },
      ok: { pill: 'não era erro', bg: '#E5E3DE' },
      espera: { pill: 'esperando o próximo repasse', bg: '#EFECE5' }
    };
    const base = [
      { id: 'a', t: 'Comissão de 15% onde o contrato diz 12%', v: 'R$ 412', info: { analise: 'protocolo 48213 · desde 02/out', negada: 'protocolo 48213' } },
      { id: 'b', t: 'Cancelamento pelo cliente cobrado da loja', v: 'R$ 238', info: { creditada: 'voltou no repasse de 14/out (conferido por nós)' } },
      { id: 'c', t: 'Cupom cofinanciado debitado inteiro da loja', v: 'R$ 186', info: { contestar: 'prazo até 15/nov', analise: 'contestada hoje' } },
      { id: 'd', t: 'Cancelamento por atraso do entregador (99Food)', v: 'R$ 120', info: { contestar: 'prazo até 20/nov', analise: 'contestada hoje' } },
      { id: 'e', t: 'Promoção da semana sem acordo registrado', v: 'R$ 148', info: { resposta: 'se não foi combinado, dá para contestar', contestar: 'prazo até 22/nov', ok: 'tirada da lista' } },
      { id: 'f', t: 'Repasse da semana 37 menor que a apuração (99Food)', v: 'R$ 80', info: { espera: 'pode ser só atraso; avisamos se não vier' } }
    ];
    const set = (id, s) => () => this.setState({ st: Object.assign({}, this.state.st, { [id]: s }) });
    return {
      items: base.map((b) => {
        const s = this.state.st[b.id];
        return {
          t: b.t, v: b.v, pill: S[s].pill, bg: S[s].bg, info: (b.info && b.info[s]) || '',
          isContestar: s === 'contestar', isAnalise: s === 'analise', isResposta: s === 'resposta',
          marcar: set(b.id, 'analise'), negar: set(b.id, 'negada'), sim: set(b.id, 'ok'), nao: set(b.id, 'contestar')
        };
      })
    };
  }
}
</script>
</body>
</html>
