[project]
name = "margo-contracts"
version = "0.0.0"
description = "Pydantic models generated from supabase/migrations"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.8"]

[project.optional-dependencies]
gen = ["psycopg[binary]>=3.2"]

[project.scripts]
gen-models = "margo_contracts.gen:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/margo_contracts"]
