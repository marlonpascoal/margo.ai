[project]
name = "margoai"
version = "0.0.0"
description = "MargoAI workspace root: workers and repo scripts"
requires-python = ">=3.12,<3.13"
dependencies = ["margo-common[local]", "margo-contracts[gen]", "margo-collector[local]", "margo-import[local]", "margo-render[local]", "margo-account[local]", "margo-cost[local]"]

[tool.uv]
package = false

[tool.uv.sources]
margo-common = { workspace = true }
margo-contracts = { workspace = true }
margo-collector = { workspace = true }
margo-import = { workspace = true }
margo-render = { workspace = true }
margo-account = { workspace = true }
margo-cost = { workspace = true }

[tool.uv.workspace]
members = ["workers/*", "packages/contracts"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pypdf>=5"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests", "workers", "packages/contracts/python/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["design", "node_modules", "apps", "extension"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Expected messages and sample values read better unwrapped.
"**/tests/**" = ["E501"]
# SQL column lists and the drawn copy read better unwrapped.
"scripts/gen_g_syn_m1.py" = ["E501"]
"scripts/gen_g_syn_m3.py" = ["E501"]
"workers/collector/src/margo_collector/repo.py" = ["E501"]
"workers/render/src/margo_render/P01_raio_x.py" = ["E501"]
"workers/render/src/margo_render/handlers.py" = ["E501"]
# SQL statements and generated value lists read better unwrapped.
"workers/import/src/margo_import/db.py" = ["E501"]
"workers/cost/src/margo_cost/db.py" = ["E501"]
"fixtures/m2/generate.py" = ["E501"]
