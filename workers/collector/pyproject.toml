[project]
name = "margo-collector"
version = "0.0.0"
description = "worker-collector (M1): public iFood pages under D47, and the price X-ray rules M1-01 to M1-08"
requires-python = ">=3.12,<3.13"
dependencies = ["margo-common", "margo-contracts"]

[project.optional-dependencies]
local = ["psycopg[binary]>=3.2"]

[project.scripts]
collector = "margo_collector.cli:main"

[project.entry-points."margo.jobs"]
collect = "margo_collector.handlers:collect"
xray_neighborhood = "margo_collector.handlers:xray_neighborhood"
xray_pair = "margo_collector.handlers:xray_pair"
xray_calc = "margo_collector.handlers:xray_calc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/margo_collector"]

[tool.uv.sources]
margo-common = { workspace = true }
margo-contracts = { workspace = true }
