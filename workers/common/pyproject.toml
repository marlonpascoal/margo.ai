[project]
name = "margo-common"
version = "0.0.0"
description = "Job runner, Runner interface, Supabase client and signing shared by all workers"
requires-python = ">=3.12,<3.13"
dependencies = ["margo-contracts", "pydantic>=2.8"]

[project.optional-dependencies]
# Direct Postgres connection for the LocalRunner and DB-backed tests (local stack only).
local = ["psycopg[binary]>=3.2"]

[project.scripts]
worker = "margo_common.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/margo_common"]

[tool.uv.sources]
margo-contracts = { workspace = true }
