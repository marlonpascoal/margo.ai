[project]
name = "margo-cost"
version = "0.0.0"
description = "worker-cost: ingredient prices, recipe cost and contribution per dish and channel (M3, 04 §4)"
requires-python = ">=3.12,<3.13"
dependencies = ["margo-common", "margo-contracts"]

[project.optional-dependencies]
local = ["psycopg[binary]>=3.2"]

[project.entry-points."margo.jobs"]
compute_contribution = "margo_cost.jobs:compute_contribution"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/margo_cost"]

[tool.uv.sources]
margo-common = { workspace = true }
margo-contracts = { workspace = true }
