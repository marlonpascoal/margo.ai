[project]
name = "margo-import"
version = "0.0.0"
description = "worker-import: iFood export file and 99Food statement parsers, column mapping, close and differences (M2)"
requires-python = ">=3.12,<3.13"
dependencies = ["margo-common", "margo-contracts", "openpyxl>=3.1"]

[project.optional-dependencies]
local = ["psycopg[binary]>=3.2"]

[project.entry-points."margo.jobs"]
import_ifood_file = "margo_import.jobs:import_ifood_file"
import_99food_file = "margo_import.jobs:import_99food_file"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/margo_import"]

[tool.uv.sources]
margo-common = { workspace = true }
margo-contracts = { workspace = true }
