[project]
name = "margo-match"
version = "0.0.0"
description = "worker-match: invoice line to catalog ingredient by GTIN, rules and AI suggestions (M3, D14, D70)"
requires-python = ">=3.12,<3.13"
dependencies = ["margo-common", "margo-contracts"]

[project.optional-dependencies]
local = ["psycopg[binary]>=3.2"]

[project.scripts]
record-ai = "margo_match.record:main"

[project.entry-points."margo.jobs"]
match_ai = "margo_match.jobs:match_ai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/margo_match"]

[tool.uv.sources]
margo-common = { workspace = true }
margo-contracts = { workspace = true }
