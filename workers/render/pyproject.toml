[project]
name = "margo-render"
version = "0.0.0"
description = "worker-render: PDFs (weasyprint) and xlsx (openpyxl). Wave 0 holds only the design tokens."
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/margo_render"]
